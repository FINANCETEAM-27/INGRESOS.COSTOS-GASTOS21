name: Sincronizar Movimiento Auxiliar Siigo

on:
  schedule:
    # 04:00 UTC = 11:00 PM hora Colombia (UTC-5)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic para pruebas

jobs:
  descargar-y-guardar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de descarga de reporte
        run: node sync_reporte.js
        env:
          SIIGO_USERNAME: ${{ secrets.SIIGO_USERNAME }}
          SIIGO_ACCESS_KEY: ${{ secrets.SIIGO_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ github.event.repository.name }}
